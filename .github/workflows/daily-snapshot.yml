name: Daily public snapshots

on:
  workflow_dispatch:
  schedule:
    - cron: "17 11 * * *"

permissions:
  contents: write

concurrency:
  group: daily-public-snapshots
  cancel-in-progress: false

jobs:
  collect:
    runs-on: macos-latest
    timeout-minutes: 10
    steps:
      - name: Get the dashboard
        uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Read public profile counts
        run: node scripts/collect.mjs

      - name: Save today's snapshot
        run: |
          if git diff --quiet -- data/snapshots.json; then
            echo "No snapshot changes to save."
            exit 0
          fi
          git config user.name "LOOKOUT Daily Checker"
          git config user.email "actions@users.noreply.github.com"
          git add data/snapshots.json
          git commit -m "Log daily public snapshots"
          git push
